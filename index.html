<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MGIS130 - GPA Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>GPA Calculator</h1>
      <p>Demonstrating Three-Layer Architecture</p>
    </header>

    <main>
      <!-- Input Controls Section -->
      <section class="card input-section">
        <h2>Add Course</h2>
        <form id="course-form">
          <div class="form-group">
            <label for="course-name">Course Name</label>
            <input type="text" id="course-name" placeholder="e.g., MGIS130" required>
          </div>
          
          <div class="form-group">
            <label for="course-credits">Credits</label>
            <input type="number" id="course-credits" min="1" max="6" value="3" required>
          </div>

          <div class="form-group">
            <label for="course-grade">Grade</label>
            <select id="course-grade">
              <option value="4.0">A (4.0)</option>
              <option value="3.7">A- (3.7)</option>
              <option value="3.3">B+ (3.3)</option>
              <option value="3.0">B (3.0)</option>
              <option value="2.7">B- (2.7)</option>
              <option value="2.3">C+ (2.3)</option>
              <option value="2.0">C (2.0)</option>
              <option value="1.0">D (1.0)</option>
              <option value="0.0">F (0.0)</option>
            </select>
          </div>

          <button type="submit" id="add-btn">Add Course</button>
        </form>
      </section>

      <!-- Results Display Section -->
      <section class="card results-section">
        <h2>Summary</h2>
        <div class="gpa-display">
          <span class="gpa-label">Cumulative GPA:</span>
          <span id="gpa-val">0.00</span>
        </div>
        <div class="credits-display">
          <span>Total Credits: </span><strong id="total-credits">0</strong>
        </div>
      </section>

      <!-- Course List Table -->
      <section class="card list-section">
        <h2>Course List</h2>
        <table id="courses-table">
          <thead>
            <tr>
              <th>Course</th>
              <th>Credits</th>
              <th>Grade</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="courses-list">
            <!-- Dynamic rows will go here -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
